<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SMS-USCE | Track Your Enquiry</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Arial;background:#f1f5f9;color:#173451;margin:0}main{max-width:720px;margin:40px auto;padding:24px;background:white;border:1px solid #dce2e8;border-radius:10px}h1{font-size:28px}label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aebdcc;border-radius:5px;font:inherit}button{background:#193f65;color:white;border:0;padding:12px 20px;border-radius:5px;margin-top:16px;font:inherit;cursor:pointer}article{border-top:1px solid #dce2e8;padding:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#185b91}@media(max-width:760px){main{margin:12px}}</style></head><body><main><a href="about.html">← SMS–USCE</a><h1>Track Your Enquiry</h1><p>Enter your email and private enquiry code to view your response.</p><form id="track"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><label for="code">Enquiry code</label><input id="code" required autocomplete="off" spellcheck="false"><button>View enquiry</button></form><p id="status" role="status"></p><section id="result"></section><button id="close" hidden>Close enquiry</button></main><script>const db=supabase.createClient('https://lsvccttwcxsgconkcdio.supabase.co','sb_publishable_mzwVC3MfLJ2c_AZTdDcNsw_S_vRmg3H',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const $=id=>document.getElementById(id);$('track').onsubmit=async e=>{e.preventDefault();$('result').replaceChildren();$('close').hidden=true;const b=e.target.querySelector('button');b.disabled=true;$('status').textContent='Loading…';try{const {data,error}=await db.rpc('track_enquiry',{p_email:$('email').value.trim(),p_code:$('code').value.trim()});if(error||!data)throw Error();$('status').textContent=data.status;const add=(title,body)=>{const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p');h.textContent=title;p.textContent=body;a.append(h,p);$('result').append(a)};add(data.name+' · '+data.subject,new Date(data.created_at).toLocaleString()+'\n'+data.message);for(const r of data.replies)add('SMS–USCE Administration · '+new Date(r.created_at).toLocaleString(),r.body);$('close').hidden=false;}catch{$('status').textContent='Unable to find enquiry. Check your email and code and try again.';}finally{b.disabled=false;}};$('close').onclick=()=>{$('result').replaceChildren();$('track').reset();$('status').textContent='';$('close').hidden=true;};</script></body></html>
